name: Add ART section

on:
  push:
    paths:
      - '.github/workflows/add-art-section.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add ART section to live site
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          style_path = Path('style.css')

          index = index_path.read_text()
          style = style_path.read_text()

          old_nav = '<header><a class="pfw" href="#top" aria-label="Psych Fest West home"><img src="images/pfw-logo-site-256.png?v=2" alt="" style="width:40px!important;height:40px!important"></a><nav><a href="#top">Home</a><a href="#event">Events</a><a href="#about">About</a><a href="#join">Join</a><a href="https://instagram.com/psychfestwest" target="_blank">@psychfestwest</a></nav></header>'
          new_nav = '<header><a class="pfw" href="#top" aria-label="Psych Fest West home"><img src="images/pfw-logo-site-256.png?v=2" alt="" style="width:40px!important;height:40px!important"></a><nav><a href="#top">Home</a><a href="#event">Events</a><a href="#about">About</a><a href="#art">Art</a><a href="#join">Join</a><a href="https://instagram.com/psychfestwest" target="_blank">@psychfestwest</a></nav></header>'

          if old_nav not in index:
              raise SystemExit('Expected navigation markup not found; refusing to modify index.html')
          index = index.replace(old_nav, new_nav, 1)

          join_marker = '</section>\n\n<section id="join" class="two join">'
          art_section = '''</section>

<section id="art" class="art-section">
  <p class="eyebrow">PREMONITIONS, VISIONS, AND OTHER DIMENSIONS</p>
  <div class="art-head">
    <div><h2>ART</h2></div>
    <div class="art-intro-copy">
      <p class="art-lead">Celebrate the cosmic spirit of Psych Fest West.</p>
      <p>These designs capture the otherworldly vibes that inspire Psych Fest West. More to come...</p>
    </div>
  </div>
  <div class="art-grid" aria-label="Psych Fest West artwork gallery">
    <a class="art-piece" href="images/PFW-dave-2.jpeg" target="_blank" rel="noopener noreferrer" aria-label="Open Psych Fest West artwork in a new tab"><img src="images/PFW-dave-2.jpeg" alt="Psych Fest West psychedelic artwork" loading="lazy" decoding="async"></a>
    <a class="art-piece" href="images/PFW-dave-1.jpeg" target="_blank" rel="noopener noreferrer" aria-label="Open Psych Fest West artwork in a new tab"><img src="images/PFW-dave-1.jpeg" alt="Psych Fest West psychedelic artwork" loading="lazy" decoding="async"></a>
    <a class="art-piece" href="images/PFW-rotating-face.gif" target="_blank" rel="noopener noreferrer" aria-label="Open animated Psych Fest West artwork in a new tab"><img src="images/PFW-rotating-face.gif" alt="Animated Psych Fest West psychedelic artwork" loading="lazy"></a>
    <a class="art-piece" href="images/PFW-animated-face.gif" target="_blank" rel="noopener noreferrer" aria-label="Open animated Psych Fest West artwork in a new tab"><img src="images/PFW-animated-face.gif" alt="Animated Psych Fest West psychedelic artwork" loading="lazy"></a>
    <a class="art-piece" href="images/PFW-sam-1.svg" target="_blank" rel="noopener noreferrer" aria-label="Open Psych Fest West artwork in a new tab"><img src="images/PFW-sam-1.svg" alt="Psych Fest West psychedelic artwork" loading="lazy" decoding="async"></a>
  </div>
</section>

<section id="join" class="two join">'''

          if join_marker not in index:
              raise SystemExit('Expected ABOUT/JOIN boundary not found; refusing to modify index.html')
          index = index.replace(join_marker, art_section, 1)

          css_marker = '/* Psych Fest West Doomsletter form. Brevo controls behavior; these rules control appearance only. */'
          art_css = r'''
/* ART gallery */
.art-section{border-top:1px solid #f4edcf33}
.art-head{display:grid;grid-template-columns:.9fr 1.1fr;gap:65px;align-items:end;margin-top:16px}
.art-head h2{font:400 clamp(74px,10vw,138px)/.78 'Archivo Black';letter-spacing:-.07em;margin:0;color:#f4edcf}
.art-intro-copy{max-width:560px;padding-bottom:8px}
.art-intro-copy p{margin:0;color:#f4edcfbb;font-size:18px;line-height:1.55}
.art-intro-copy .art-lead{color:#f4edcf;font-size:24px;font-weight:600;line-height:1.35;margin-bottom:12px}
.art-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;align-items:start;margin-top:54px}
.art-piece{display:block;text-decoration:none;position:relative;overflow:hidden;border:1px solid #f4edcf33;background:#0b071066;box-shadow:8px 8px 0 #8d66ff2e;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.art-piece img{display:block;width:100%;height:auto;transition:transform .25s ease;transform-origin:center}
.art-piece:hover{transform:translate(-3px,-3px);border-color:#f4edcf77;box-shadow:12px 12px 0 #ff5fc844}
.art-piece:hover img{transform:scale(1.015)}
.art-piece:focus-visible{outline:2px solid #d9ff4f;outline-offset:5px}
@media(max-width:980px){.art-head{grid-template-columns:1fr;gap:18px}.art-intro-copy{padding-bottom:0}.art-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:42px}}
@media(max-width:760px){.art-head h2{font-size:clamp(64px,24vw,104px)}.art-intro-copy .art-lead{font-size:21px}.art-intro-copy p{font-size:16px}.art-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:34px}.art-piece{box-shadow:6px 6px 0 #8d66ff2e}.art-piece:hover{transform:none;box-shadow:6px 6px 0 #8d66ff2e}.art-piece:hover img{transform:none}}

'''

          if css_marker not in style:
              raise SystemExit('Expected CSS insertion marker not found; refusing to modify style.css')
          if '.art-grid{' in style:
              raise SystemExit('ART gallery styles already present; refusing duplicate insertion')
          style = style.replace(css_marker, art_css + css_marker, 1)

          index_path.write_text(index)
          style_path.write_text(style)
          PY

      - name: Commit live ART section
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css
          git diff --cached --quiet && exit 0
          git commit -m "Add ART gallery section"
          git push
