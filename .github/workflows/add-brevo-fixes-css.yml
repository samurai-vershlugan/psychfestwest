name: Add Brevo fixes CSS
on:
  push:
    paths:
      - '.github/workflows/add-brevo-fixes-css.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Brevo fixes stylesheet
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          link = '<link rel="stylesheet" href="brevo-fixes.css?v=1">\n'
          if 'brevo-fixes.css' not in s:
              marker = '<link rel="stylesheet" href="https://sibforms.com/forms/end-form/build/sib-styles.css">\n'
              if marker not in s:
                  raise SystemExit('Brevo stylesheet marker not found')
              s = s.replace(marker, marker + link, 1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load Brevo form fixes" || true
          git rm .github/workflows/add-brevo-fixes-css.yml
          git commit -m "Remove one-shot Brevo fixes workflow"
          git push
