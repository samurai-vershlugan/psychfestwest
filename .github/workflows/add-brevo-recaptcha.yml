name: Add Brevo reCAPTCHA
on:
  push:
    paths:
      - '.github/workflows/add-brevo-recaptcha.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add reCAPTCHA to existing styled Brevo form
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          sitekey = '6LcMPq0tAAAAAIVNwkASyslaIljX_u_aDSQ9hKMR'

          if 'g-recaptcha-v3' not in s:
              marker = '<button class="sib-form-block__button sib-form-block__button-with-loader"'
              if marker not in s:
                  raise SystemExit('Brevo submit button marker not found')
              captcha = f'<div class="g-recaptcha-v3" data-sitekey="{sitekey}" style="display: none"></div>\n\n              '
              s = s.replace(marker, captcha + marker, 1)

          recaptcha_src = f'https://www.google.com/recaptcha/api.js?render={sitekey}&hl=en'
          if recaptcha_src not in s:
              mainjs = '<script defer src="https://sibforms.com/forms/end-form/build/main.js"></script>'
              if mainjs not in s:
                  raise SystemExit('Brevo main.js marker not found')
              s = s.replace(mainjs, mainjs + f'\n<script src="{recaptcha_src}" async defer></script>', 1)

          p.write_text(s)
          PY
      - name: Commit update and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-brevo-recaptcha.yml
          git add index.html
          git commit -m 'Add Brevo reCAPTCHA v3 protection'
          git push
