name: Finalize site assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-site-assets.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update site asset paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          s = s.replace('href="pfw-logo-v2.png"', 'href="images/pfw-logo-transparent.png?v=5"')
          s = s.replace('<img src="pfw-logo-v2.png" alt="">', '<img src="images/pfw-logo-transparent.png?v=5" alt="" style="width:36px!important;height:36px!important">')
          s = s.replace('adventures-in-timeland-flyer.png', 'images/adventures-in-timeland-flyer.png')
          p.write_text(s)
          PY

      - name: Remove obsolete root assets
        run: |
          rm -f adventures-in-timeland-flyer.png
          rm -f favicon.ico
          rm -f pfw-logo-cachebust.txt
          rm -f pfw-logo-v2.png
          rm -f pfw-logo.svg
          rm -f pfw-mark.png

      - name: Commit cleanup and remove workflow
        run: |
          rm .github/workflows/finalize-site-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Organize site images and use final PFW logo"
          git push
