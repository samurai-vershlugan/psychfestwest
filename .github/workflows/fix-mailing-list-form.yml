name: Fix mailing list form
on:
  push:
    paths:
      - '.github/workflows/fix-mailing-list-form.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update helper text and stylesheet version
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); s=s.replace('Provide your email address to subscribe to our newsletter','Provide your email address to subscribe to the doomsletter'); s=s.replace('The SMS field must contain between 6 and 19 digits and include the country code without using +/0 (e.g. 1xxxxxxxxxx for the United States)','Provide your mobile number (numbers only) to receive text updates'); s=s.replace('brevo-fixes.css?v=1','brevo-fixes.css?v=2'); p.write_text(s)"
      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Update mailing list helper text" || true
          git rm .github/workflows/fix-mailing-list-form.yml
          git commit -m "Remove one-shot mailing list workflow"
          git push
