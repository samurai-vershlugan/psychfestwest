name: Inline PFW logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pfw-logo-binary.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline logo for nav and favicon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re

          logo = Path('pfw-logo-v2.png').read_bytes()
          data_uri = 'data:image/png;base64,' + base64.b64encode(logo).decode('ascii')

          p = Path('index.html')
          text = p.read_text()
          text = re.sub(r'<link rel="icon"[^>]*>', f'<link rel="icon" type="image/png" href="{data_uri}">', text, count=1)
          text = re.sub(r'<a class="pfw" href="#top" aria-label="Psych Fest West home"><img src="[^"]+" alt=""></a>',
                        f'<a class="pfw" href="#top" aria-label="Psych Fest West home"><img src="{data_uri}" alt=""></a>',
                        text, count=1)
          p.write_text(text)
          PY
      - name: Commit inline logo and remove workflow
        run: |
          rm .github/workflows/fix-pfw-logo-binary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-pfw-logo-binary.yml
          git commit -m "Inline PFW logo for nav and favicon"
          git push
