name: Temporary nav patch
on:
  push:
    paths:
      - '.github/workflows/nav-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Instagram nav label
        run: |
          sed -i 's/@psychfestwest ↗/@psychfestwest/' index.html
          printf '\n/* Keep the Instagram nav label consistent on mobile. */\n@media(max-width:760px){header nav a:last-child::after{content:"@PSYCHFESTWEST"!important}}\n' >> style.css
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/nav-patch.yml
          git add index.html style.css .github/workflows/nav-patch.yml
          git commit -m "Unify Instagram nav label across screen sizes"
          git push
