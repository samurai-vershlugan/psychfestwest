name: Refine mailing list UI
on:
  push:
    paths:
      - '.github/workflows/refine-mailing-list-ui.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch mailing list copy
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); s=s.replace('<p>Get the venue announcement, October 18 details and first word on future Psych Fest West events.</p>','<p>Get important announcements, event information and occasional transmissions from beyond the beyond.</p>',1); s=s.replace('<p><strong>Subscribe to The Doomsletter</strong><br><br>Event announcements, venue updates and occasional transmissions from beyond the beyond.</p>','<p><strong>Subscribe to The Doomsletter</strong></p>',1); p.write_text(s)"
      - name: Commit update and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refine-mailing-list-ui.yml
          git add index.html
          git commit -m 'Refine mailing list copy'
          git push
