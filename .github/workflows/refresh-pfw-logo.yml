name: Refresh PFW logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-pfw-logo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update logo references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          text = text.replace('pfw-mark.png', 'pfw-logo-v2.png?v=2')
          p.write_text(text)
          PY
      - name: Commit changes and remove workflow
        run: |
          rm .github/workflows/refresh-pfw-logo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/refresh-pfw-logo.yml
          git commit -m "Refresh PFW logo references"
          git push
