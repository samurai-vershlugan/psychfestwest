name: Restore Brevo country picker
on:
  push:
    paths:
      - '.github/workflows/restore-brevo-country-picker.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good SMS country picker markup
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          good = subprocess.check_output([
              'git','show','b1f68cd4bc072fed88d3c737f2ea347ccac09ded:index.html'
          ], text=True)
          current_path = Path('index.html')
          current = current_path.read_text()

          start_marker = '<div style="padding: 8px 0;"><div class="sib-sms-field sib-form-block">'
          end_marker = '<div class="g-recaptcha-v3"'

          def extract(text):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[start:end]

          good_sms = extract(good)
          cur_start = current.index(start_marker)
          cur_end = current.index(end_marker, cur_start)
          updated = current[:cur_start] + good_sms + current[cur_end:]
          current_path.write_text(updated)
          PY
      - name: Commit country picker restore
        run: |
          git config user.name "samurai-vershlugan"
          git config user.email "samurai@feathergun.com"
          git add index.html
          git commit -m "Restore Brevo United States default and country list"
          git push