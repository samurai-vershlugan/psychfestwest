name: Restore known-good PFW form
on:
  push:
    paths:
      - '.github/workflows/restore-known-good-form.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact approved form-era files and preserve ART behavior
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          checkpoint = '51e8e7c2f915ef3052d28ef079d986dc08e3d34c'
          index = subprocess.check_output(['git','show',f'{checkpoint}:index.html'], text=True)
          script = subprocess.check_output(['git','show',f'{checkpoint}:script.js'], text=True)

          old_gallery = '''    <a class="art-piece" href="images/PFW-dave-2.jpeg" target="_blank" rel="noopener noreferrer" aria-label="Open Psych Fest West artwork in a new tab"><img src="images/PFW-dave-2.jpeg" alt="Psych Fest West psychedelic artwork" loading="lazy" decoding="async"></a>
    <a class="art-piece" href="images/PFW-dave-1.jpeg" target="_blank" rel="noopener noreferrer" aria-label="Open Psych Fest West artwork in a new tab"><img src="images/PFW-dave-1.jpeg" alt="Psych Fest West psychedelic artwork" loading="lazy" decoding="async"></a>
    <a class="art-piece" href="images/PFW-rotating-face.gif" target="_blank" rel="noopener noreferrer" aria-label="Open animated Psych Fest West artwork in a new tab"><img src="images/PFW-rotating-face.gif" alt="Animated Psych Fest West psychedelic artwork" loading="lazy"></a>
    <a class="art-piece" href="images/PFW-animated-face.gif" target="_blank" rel="noopener noreferrer" aria-label="Open animated Psych Fest West artwork in a new tab"><img src="images/PFW-animated-face.gif" alt="Animated Psych Fest West psychedelic artwork" loading="lazy"></a>
    <a class="art-piece" href="images/PFW-sam-1.svg" target="_blank" rel="noopener noreferrer" aria-label="Open Psych Fest West artwork in a new tab"><img src="images/PFW-sam-1.svg" alt="Psych Fest West psychedelic artwork" loading="lazy" decoding="async"></a>'''

          new_gallery = '''    <a class="art-piece" href="images/PFW-dave-2.jpeg" target="_blank" rel="noopener noreferrer" aria-label="Open Psych Fest West artwork in a new tab"><img src="images/PFW-dave-2.jpeg" alt="Psych Fest West psychedelic artwork" loading="lazy" decoding="async"></a>
    <div class="art-piece" aria-label="Animated Psych Fest West artwork"><img src="images/PFW-rotating-face.gif" alt="Animated Psych Fest West psychedelic artwork" loading="lazy"></div>
    <a class="art-piece" href="images/PFW-dave-1.jpeg" target="_blank" rel="noopener noreferrer" aria-label="Open Psych Fest West artwork in a new tab"><img src="images/PFW-dave-1.jpeg" alt="Psych Fest West psychedelic artwork" loading="lazy" decoding="async"></a>
    <div class="art-piece" aria-label="Animated Psych Fest West artwork"><img src="images/PFW-animated-face.gif" alt="Animated Psych Fest West psychedelic artwork" loading="lazy"></div>
    <a class="art-piece" href="images/PFW-sam-1.svg" target="_blank" rel="noopener noreferrer" aria-label="Open Psych Fest West artwork in a new tab"><img src="images/PFW-sam-1.svg" alt="Psych Fest West psychedelic artwork" loading="lazy" decoding="async"></a>'''

          if old_gallery not in index:
              raise SystemExit('Expected ART gallery block not found in checkpoint')
          index = index.replace(old_gallery, new_gallery, 1)
          Path('index.html').write_text(index)
          Path('script.js').write_text(script)
          PY
      - name: Commit exact restoration
        run: |
          git config user.name "samurai-vershlugan"
          git config user.email "samurai@feathergun.com"
          git add index.html script.js
          git commit -m "Restore exact approved Brevo CAPTCHA state while preserving ART gallery"
          git push