name: Switch to colored PFW logo
on:
  push:
    paths:
      - '.github/workflows/switch-colored-logo.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update logo references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('images/pfw-logo-transparent.png?v=5', 'images/pfw-logo-color.png?v=1')
          s = s.replace('style="width:36px!important;height:36px!important"', 'style="width:32px!important;height:32px!important"')
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use colored PFW logo for nav and favicon"
          git rm .github/workflows/switch-colored-logo.yml
          git commit -m "Remove one-shot colored logo workflow"
          git push
