name: Switch PFW logo to SVG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/switch-pfw-logo-to-svg.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace broken image data with SVG asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          bad = 'data:image/png;base64,aVZCT1J3MEtHZ29BQUFBTlNVaEVVZ0FBQVFBQUFBRUFDQVlBQUFCY2NxaG1BQUEuLi4='
          if bad not in text:
              raise SystemExit('Broken embedded logo reference not found')
          text = text.replace(bad, 'pfw-logo.svg?v=3')
          p.write_text(text)
          PY
      - name: Commit SVG references and clean workflows
        run: |
          rm .github/workflows/switch-pfw-logo-to-svg.yml
          rm -f .github/workflows/fix-pfw-logo-binary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pfw-logo.svg .github/workflows/
          git commit -m "Use vector PFW logo for nav and favicon"
          git push
