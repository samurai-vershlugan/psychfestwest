name: Ticker seam spacing

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ticker-gap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add ticker seam spacing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('style.css')
          text = p.read_text()
          old = '  padding-right:0;\n  animation:pfwTickerScroll 42s linear infinite;'
          new = '  padding-right:.7em;\n  animation:pfwTickerScroll 42s linear infinite;'
          if old not in text:
              raise SystemExit('Ticker padding rule not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          git commit -m "Add spacing at ticker loop seam"
          git push
