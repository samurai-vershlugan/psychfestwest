name: Update community journey copy
on:
  push:
    paths:
      - '.github/workflows/update-community-journey.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update manifesto
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'THE POINT IS THE COMMUNITY.'
          new = 'THE COMMUNITY IS THE JOURNEY.'
          if old not in s:
              raise SystemExit('Expected manifesto text not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit update and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/update-community-journey.yml
          git add index.html
          git commit -m 'Restore community journey manifesto'
          git push
