name: Update manifesto copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-manifesto.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update manifesto
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          old = '<p>THE COMMUNITY IS THE JOURNEY.</p>'
          new = '<p>COMMUNITY IS THE JOURNEY.</p>'
          if old not in text:
              raise SystemExit('Manifesto text not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove article from community manifesto line"
          git push
